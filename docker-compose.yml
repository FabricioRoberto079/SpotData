services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spotdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: spotdata-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:?LLM_CHAT_MODEL required}
      LLM_STRUCTURED_MODEL: ${LLM_STRUCTURED_MODEL}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:?LLM_EMBEDDING_MODEL required}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?EMBEDDING_DIMENSION required}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:?JWT_ALGORITHM required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:?JWT_EXPIRATION_MINUTES required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL required}
    ports:
      - "8080:8080"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8080"

volumes:
  postgres_data:
